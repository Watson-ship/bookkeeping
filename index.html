<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>记账小助手</title>
<meta name="description" content="手机记账软件：每日记账、价格对比、剩余使用天数、花费占比统计">
<meta name="theme-color" content="#4f7cff">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="记账">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <h1 id="page-title">📝 每日记账</h1>
  <button class="icon-btn" id="settings-btn" aria-label="设置">⚙️</button>
</header>

<main>

  <!-- ============ 页1：每日记账（记一笔 + 汇总 + 占比） ============ -->
  <section id="page-records" class="page active">
    <div class="summary">
      <div class="tile"><div class="num" id="sum-day">¥0.00</div><div class="lbl">当日</div></div>
      <div class="tile"><div class="num" id="sum-week">¥0.00</div><div class="lbl">本周</div></div>
      <div class="tile"><div class="num" id="sum-month">¥0.00</div><div class="lbl">本月</div></div>
      <div class="tile"><div class="num" id="sum-year">¥0.00</div><div class="lbl">本年</div></div>
    </div>

    <form id="record-form" class="card form" autocomplete="off">
      <h2>➕ 记一笔</h2>
      <div class="form-grid">
        <label class="field">日期
          <input id="r-date" type="date" required>
        </label>
        <label class="field">物品名称
          <input id="r-name" type="text" list="item-suggestions" placeholder="如：洗发水" required>
        </label>
        <label class="field">单价（元）
          <input id="r-price" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0.00">
        </label>
        <label class="field">数量（可带单位）
          <input id="r-qty" type="text" placeholder="如 2、3瓶">
        </label>
        <label class="field">使用天数
          <input id="r-days" type="number" min="1" inputmode="numeric" placeholder="如 30">
        </label>
        <label class="field">总价（元）
          <input id="r-total" type="number" step="0.01" min="0" inputmode="decimal" placeholder="数量为纯数字时自动计算" required>
        </label>
      </div>
      <datalist id="item-suggestions"></datalist>
      <button type="submit" class="btn primary">记入</button>
    </form>

    <div class="card quick-rec hidden" id="quick-rec">
      <div class="quick-title">快捷填写 · 已有物品</div>
      <div class="chips" id="rec-chips"></div>
    </div>

    <div class="card day-total" id="day-total">当日合计 ¥0.00</div>
    <div id="record-list"></div>

    <div class="card">
      <div class="stat-head">
        <span class="muted">花费占比</span>
        <span id="stat-count" class="muted"></span>
      </div>
      <div class="period-tabs" style="margin:10px 0 4px">
        <button class="period-tab" data-range="today">当日</button>
        <button class="period-tab" data-range="week">本周</button>
        <button class="period-tab active" data-range="month">本月</button>
        <button class="period-tab" data-range="year">本年</button>
      </div>
      <div class="stat-total" id="stat-total">¥0.00</div>
      <canvas id="pie-chart"></canvas>
      <div id="chart-legend"></div>
      <div class="hidden" id="top-card"></div>
    </div>
  </section>

  <!-- ============ 页2：价格对比（同名合并，价格变化） ============ -->
  <section id="page-price" class="page">
    <div id="price-list"></div>
  </section>

  <!-- ============ 页3：剩余使用天数（库存） ============ -->
  <section id="page-stock" class="page">
    <div class="summary" id="stock-sum"></div>
    <div id="stock-list"></div>
  </section>

</main>

<nav class="tabbar">
  <button class="tab active" data-page="records"><span class="ico">📝</span><span>记账</span></button>
  <button class="tab" data-page="price"><span class="ico">💹</span><span>价格</span></button>
  <button class="tab" data-page="stock"><span class="ico">📦</span><span>库存</span></button>
</nav>

<div id="install-banner" class="install-banner hidden">
  <span id="install-text">可安装到手机桌面</span>
  <button id="install-btn" class="mini">📲 安装</button>
  <button id="install-close" class="mini ghost-x" aria-label="关闭">✕</button>
</div>

<div id="modal-backdrop">
  <div class="modal">
    <div id="modal-title"></div>
    <div id="modal-body"></div>
    <div id="modal-foot"></div>
  </div>
</div>

<div id="toast"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script src="app.js"></script>
</body>
</html>
